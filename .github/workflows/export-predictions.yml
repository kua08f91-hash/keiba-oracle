name: Export Predictions

on:
  schedule:
    # ── 土曜 (レース日) ── JST = UTC+9
    - cron: '0 21 * * 5'   # 06:00 JST — 朝イチ予想
    - cron: '0 0 * * 6'    # 09:00 JST — レース開始前
    - cron: '0 1 * * 6'    # 10:00 JST — 1R前後
    - cron: '0 2 * * 6'    # 11:00 JST
    - cron: '0 3 * * 6'    # 12:00 JST
    - cron: '0 4 * * 6'    # 13:00 JST
    - cron: '0 5 * * 6'    # 14:00 JST
    - cron: '0 6 * * 6'    # 15:00 JST — メインレース前
    - cron: '0 7 * * 6'    # 16:00 JST — 最終レース前

    # ── 日曜 (レース日) ──
    - cron: '0 21 * * 6'   # 06:00 JST — 朝イチ予想
    - cron: '0 0 * * 0'    # 09:00 JST — レース開始前
    - cron: '0 1 * * 0'    # 10:00 JST
    - cron: '0 2 * * 0'    # 11:00 JST
    - cron: '0 3 * * 0'    # 12:00 JST
    - cron: '0 4 * * 0'    # 13:00 JST
    - cron: '0 5 * * 0'    # 14:00 JST
    - cron: '0 6 * * 0'    # 15:00 JST — メインレース前
    - cron: '0 7 * * 0'    # 16:00 JST — 最終レース前
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run export
        run: python -m backend.export_predictions
        env:
          PYTHONUNBUFFERED: '1'

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet docs/data/predictions.json 2>/dev/null; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/predictions.json docs/data/archive/
          git commit -m "Auto-update predictions ($(TZ=Asia/Tokyo date '+%m/%d %H:%M') JST)"
          git push

name: Export Predictions

on:
  schedule:
    # ── 土曜 (レース日) ──
    # 06:00 JST (金 21:00 UTC) — 朝イチ予想生成
    - cron: '0 21 * * 5'
    # 09:00 JST (土 00:00 UTC) — レース開始前更新
    - cron: '0 0 * * 6'
    # 11:00 JST (土 02:00 UTC) — 午前レース反映
    - cron: '0 2 * * 6'
    # 13:00 JST (土 04:00 UTC) — 午後レース前
    - cron: '0 4 * * 6'
    # 15:00 JST (土 06:00 UTC) — メインレース前
    - cron: '0 6 * * 6'

    # ── 日曜 (レース日) ──
    # 06:00 JST (土 21:00 UTC) — 朝イチ予想生成
    - cron: '0 21 * * 6'
    # 09:00 JST (日 00:00 UTC) — レース開始前更新
    - cron: '0 0 * * 0'
    # 11:00 JST (日 02:00 UTC) — 午前レース反映
    - cron: '0 2 * * 0'
    # 13:00 JST (日 04:00 UTC) — 午後レース前
    - cron: '0 4 * * 0'
    # 15:00 JST (日 06:00 UTC) — メインレース前
    - cron: '0 6 * * 0'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run export
        run: python -m backend.export_predictions
        env:
          PYTHONUNBUFFERED: '1'

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet docs/data/predictions.json 2>/dev/null; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/predictions.json docs/data/archive/
          git commit -m "Auto-update predictions ($(TZ=Asia/Tokyo date '+%m/%d %H:%M') JST)"
          git push
